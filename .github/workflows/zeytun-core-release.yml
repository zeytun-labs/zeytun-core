name: Zeytun core release

on:
  push:
    tags: ['zeytun-core-v*']

permissions:
  contents: read

concurrency:
  group: zeytun-core-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Core (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-aarch64
            runner: macos-15
          - target: windows-x86_64
            runner: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build production core, smoke-test and package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CORE_TARGET: ${{ matrix.target }}
        run: python release/zeytun/build.py "$CORE_TARGET" "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: core-*
          merge-multiple: true
          path: dist
      - name: Record checksums and corresponding source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python release/zeytun/manifest.py "$RELEASE_TAG"
      - name: Publish complete prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        # A failed build publishes nothing. Never overwrite an existing release.
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --prerelease --title "Zeytun core $RELEASE_TAG" \
            --notes 'Production desktop core for macOS Apple Silicon and Windows x64. App CI downloads these binaries using a committed SHA-256 pin. See core-release.json for the source commit and asset digests; corresponding source and build settings are included.'
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
