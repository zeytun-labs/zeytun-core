name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TAGS: with_quic,with_grpc,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_v2ray_api,with_gvisor,with_embedded_tor,with_tailscale,with_ccm,with_ocm,with_naive_outbound,with_cloudflared,badlinkname

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            asset: zeytun-core-darwin-arm64
          - goos: darwin
            goarch: amd64
            asset: zeytun-core-darwin-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in
            v*) ;;
            *) VERSION="dev-${GITHUB_SHA::7}" ;;
          esac
          LDFLAGS="$(tr -d '\n' < release/LDFLAGS)"
          go build -v -trimpath \
            -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS} -s -w -buildid=" \
            -o "dist/${{ matrix.asset }}" \
            ./cmd/sing-box
          chmod +x "dist/${{ matrix.asset }}"
          tar -C dist -czf "dist/${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          (cd dist && shasum -a 256 "${{ matrix.asset }}" "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist

      - name: Build core manifest
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}"
          {
            echo "{"
            echo "  \"version\": \"${VERSION}\","
            echo "  \"pub_date\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
            echo "  \"platforms\": {"
            first=1
            for f in dist/zeytun-core-*.tar.gz; do
              name="$(basename "$f" .tar.gz)"
              key="${name#zeytun-core-}"
              case "$key" in
                darwin-arm64) key="macos-aarch64" ;;
                darwin-amd64) key="macos-x86_64" ;;
                linux-amd64)  key="linux-x86_64" ;;
                linux-arm64)  key="linux-aarch64" ;;
              esac
              sha="$(shasum -a 256 "$f" | cut -d' ' -f1)"
              [ $first -eq 1 ] || echo ","
              first=0
              printf '    "%s": { "url": "%s/%s.tar.gz", "sha256": "%s" }' "$key" "$BASE" "$name" "$sha"
            done
            echo ""
            echo "  }"
            echo "}"
          } > dist/core-manifest.json
          cat dist/core-manifest.json

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
